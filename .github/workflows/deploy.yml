name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # The deploy step pushes the built site to gh-pages, which needs a
    # writable GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      # optimize() reads `prepath` from config.md and rewrites absolute links
      # to /lk-as-data/... for the project Pages URL.
      - name: Build site
        run: |
          julia --project -e '
            using Franklin
            optimize(minify=false, prerender=false)'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: __site
